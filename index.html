<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Sederhana</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#243447}
header{background:#1a3a5c;color:white;padding:22px 16px;text-align:center}
main{max-width:800px;margin:35px auto;padding:0 16px}
.card{background:white;padding:24px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
button{background:#1b4f72;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
button:hover{background:#163d58}
footer{text-align:center;color:#687887;padding:24px 12px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>Web Sederhana</h1>
<p>Selamat datang di halaman web saya</p>
</header>
<main>
<section class="card">
<h2>Halaman Utama</h2>
<p>Ini adalah contoh halaman HTML sederhana. Anda dapat mengubah judul, teks, warna, dan konten sesuai kebutuhan.</p>
<button type="button" onclick="tampilkanPesan()">Klik Saya</button>
</section>
</main>
<footer>&copy; 2026 Web Sederhana</footer>
<script>
function tampilkanPesan(){alert("Halo! Halaman HTML berhasil dijalankan.");}
</script>
</body>
</html>
